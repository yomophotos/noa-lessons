<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOA マイレッスン</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2230;--sub:#6b7485;--line:#dfe3ea;--acc:#1f5eff;--acc-bg:#e8efff;--ng:#c43d3d}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ecf3;--sub:#98a1b3;--line:#2b3240;--acc:#6f9bff;--acc-bg:#202c4a;--ng:#ef7a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 64px}
h1{font-size:1.25rem;margin:8px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lbl{width:100%;font-size:.8rem;color:var(--sub);margin:0}
button,.chip{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true],.day[aria-selected=true]{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.days{display:flex;gap:6px;margin:16px 0 8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:1}
.day{flex:1;border-radius:10px;padding:8px 0;text-align:center}
h2{font-size:.95rem;color:var(--sub);margin:18px 0 6px;font-weight:600}
.les{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 8px}
.les b{font-size:1.02rem}
.meta{color:var(--sub);font-size:.85rem}
.go{grid-row:1/3;grid-column:2;align-self:center;text-decoration:none;color:#fff;background:var(--acc);border-radius:999px;padding:7px 16px;font-size:.9rem;font-weight:600}
.go.trial{background:var(--sub)}
.st{color:var(--sub);font-size:.85rem;margin:10px 0}
.err{color:var(--ng)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
textarea{width:100%;min-height:90px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (prefers-reduced-motion:no-preference){.les{transition:border-color .15s}.les:hover{border-color:var(--acc)}}
</style>
</head>
<body>
<main>
<h1>NOA マイレッスン</h1>

<p class="lbl">校舎</p>
<div class="row" id="locs"></div>
<p class="lbl">ジャンル</p>
<div class="row" id="gens"></div>
<div class="row">
  <button id="month" type="button"></button>
  <button id="reload" type="button">最新に更新</button>
</div>

<div class="days" id="days" role="tablist"></div>
<p class="st" id="st"></p>
<div id="list"></div>

<details>
  <summary>除外する先生（1行に1人・大文字小文字は区別）</summary>
  <p class="meta">表示名と完全に一致した先生のレッスンを隠します。</p>
  <textarea id="ng" spellcheck="false"></textarea>
</details>
</main>

<script>
const API = "https://1wzmgkjpc7.execute-api.ap-northeast-1.amazonaws.com/PRD";
const SITE = "https://www.noadance.com";
const LOCS = [["10","都立大"],["7","中目黒"],["2","恵比寿"],["12","原宿"],["11","赤坂"],["13","自由が丘"]];
const GENS = [["01,18","HIP-HOP"],["09","リズムトレーニング"]];
const DAYS = [[1,"月"],[2,"火"],[3,"水"],[4,"木"],[5,"金"],[6,"土"],[0,"日"]];
const DEFAULT_NG = ["NAOTO","HIROKID","STEZO","shun","motoi","Sora"];

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const S = {
  locs: new Set(store.get("locs", LOCS.map(x => x[0]))),
  gens: new Set(store.get("gens", GENS.map(x => x[0]))),
  day: new Date().getDay(),
  thisMonth: true,
  ng: store.get("ng", DEFAULT_NG),
  data: null
};
const $ = id => document.getElementById(id);
const txt = s => s == null ? "" : new DOMParser().parseFromString(String(s), "text/html").body.textContent.trim();

function chips(box, defs, set, key){
  box.innerHTML = "";
  defs.forEach(([v, name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = name;
    b.setAttribute("aria-pressed", set.has(v));
    b.onclick = () => {
      set.has(v) ? set.delete(v) : set.add(v);
      b.setAttribute("aria-pressed", set.has(v));
      store.set(key, [...set]);
      render();
    };
    box.appendChild(b);
  });
}

function drawDays(){
  const box = $("days"); box.innerHTML = "";
  DAYS.forEach(([n, name]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "day"; b.textContent = name;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", S.day === n);
    b.onclick = () => { S.day = n; drawDays(); render(); };
    box.appendChild(b);
  });
}

function monthLabel(){
  const d = new Date(); if(!S.thisMonth) d.setMonth(d.getMonth() + 1);
  return d.getMonth() + 1 + "月";
}

async function load(){
  $("month").textContent = "表示中: " + monthLabel() + "（切替）";
  $("st").textContent = "読み込み中…";
  try{
    const r = await fetch("data.json?t=" + Date.now());
    if(!r.ok) throw new Error("data.json " + r.status);
    S.data = await r.json();
    render();
  }catch(e){
    S.data = null; $("list").innerHTML = "";
    $("st").innerHTML = '<span class="err">データを読み込めませんでした（' + txt(e.message) + '）。</span>';
  }
}

function link(rec){
  if(rec.EVENT_FLG) return null;
  const q = "?tn=" + rec.TENPO_CD + "&g=" + rec.GENRE_CODE + "&l=" + rec.LEVEL_CODE + "&i=" + rec.INSTRUCTOR_CODE +
    "&b=" + rec.BRAND_ID + "&tf=" + rec.LESSON_TIME_FROM + "&tt=" + rec.LESSON_TIME_TO + "&wd=" + rec.LESSON_WEEKDAY;
  if(rec.RESERVE_FLG) return [SITE + "/reserve/" + q, "予約", ""];
  if(rec.EXP_RESERVE_FLG) return [SITE + "/trial/" + q, "体験予約", " trial"];
  return null;
}

function render(){
  const list = $("list"); list.innerHTML = "";
  if(!S.data || !S.data.d) { $("st").textContent = "データがまだありません。"; return; }
  if(!S.locs.size || !S.gens.size){ $("st").textContent = "校舎とジャンルを1つ以上選んでください。"; return; }
  const ng = new Set(S.ng);
  const grp = S.data.d[S.thisMonth ? "this" : "next"] || {};
  const seen = new Set(), byTime = {};
  let hidden = 0;
  Object.keys(grp).forEach(k => {
    const [loc, gen] = k.split("|");
    if(!S.locs.has(loc) || !S.gens.has(gen)) return;
    grp[k].forEach(it => {
      if(Number(it.youbi_flg) !== S.day) return;
      (it.time_list || []).forEach(t => (t.record || []).forEach(rec => {
        const id = rec.SEQ != null ? rec.SEQ : null;
        if(id !== null){ if(seen.has(id)) return; seen.add(id); }
        if(ng.has(txt(rec.NICKNAME))){ hidden++; return; }
        (byTime[txt(rec.Y_TIME_START)] = byTime[txt(rec.Y_TIME_START)] || []).push(rec);
      }));
    });
  });
  let shown = 0;
  Object.keys(byTime).sort().forEach(tm => {
    const h = document.createElement("h2"); h.textContent = tm; list.appendChild(h);
    byTime[tm].forEach(rec => {
      shown++;
      const d = document.createElement("div"); d.className = "les";
      const name = document.createElement("b"); name.textContent = txt(rec.NICKNAME) + (rec.TEAM && rec.TEAM !== "null" ? "（" + txt(rec.TEAM) + "）" : "");
      const m1 = document.createElement("span"); m1.className = "meta";
      m1.textContent = txt(rec.Y_TIME_START) + "〜" + txt(rec.Y_TIME_END) + "　" + txt(rec.TENPO_NAME) + (rec.STUDIO_NAME ? " " + txt(rec.STUDIO_NAME) : "");
      const m2 = document.createElement("span"); m2.className = "meta";
      m2.textContent = [txt(rec.GENRE_SUB_NAME), txt(rec.GENRE2_SUB_NAME), txt(rec.LEVEL_NAME)].filter(Boolean).join(" / ");
      d.append(name, m1, m2);
      const l = link(rec);
      if(l){ const a = document.createElement("a"); a.className = "go" + l[2]; a.href = l[0]; a.target = "_blank"; a.rel = "noopener"; a.textContent = l[1]; d.appendChild(a); }
      list.appendChild(d);
    });
  });
  $("st").textContent = shown + "件" + (hidden ? "（除外 " + hidden + "件）" : "") + (S.data.updated ? "　一覧の最終変更: " + S.data.updated : "");
}

$("month").onclick = () => { S.thisMonth = !S.thisMonth; $("month").textContent = "表示中: " + monthLabel() + "（切替）"; render(); };
$("reload").onclick = load;
$("ng").value = S.ng.join("\n");
$("ng").oninput = e => { S.ng = e.target.value.split("\n").map(s => s.trim()).filter(Boolean); store.set("ng", S.ng); render(); };

chips($("locs"), LOCS, S.locs, "locs");
chips($("gens"), GENS, S.gens, "gens");
drawDays();
load();
</script>
</body>
</html>
